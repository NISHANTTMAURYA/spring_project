<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Todo App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" th:if="${#authorization?.expr('!isAuthenticated()')}">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item" th:if="${#authorization?.expr('!isAuthenticated()')}">
                        <a class="nav-link" href="/register">Register</a>
                    </li>
                    <li class="nav-item" th:if="${#authorization?.expr('isAuthenticated()')}">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${#authorization?.expr('isAuthenticated()')}">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>Error
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-danger">
                            <h5>Oops! Something went wrong</h5>
                            <p th:text="${message != null ? message : 'An unexpected error occurred. Please try again later.'}"></p>
                        </div>
                        
                        <div class="mb-4">
                            <h6>Error Details:</h6>
                            <ul class="list-group">
                                <li class="list-group-item d-flex justify-content-between">
                                    <span>Status:</span>
                                    <span th:text="${status}">500</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span>Error:</span>
                                    <span th:text="${error}">Internal Server Error</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between" th:if="${path != null}">
                                    <span>Path:</span>
                                    <span th:text="${path}">/path</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span>Timestamp:</span>
                                    <span th:text="${#dates.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}">2023-01-01 00:00:00</span>
                                </li>
                            </ul>
                        </div>
                        
                        <div class="text-center">
                            <a href="/" class="btn btn-primary me-2">Go to Home Page</a>
                            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <div class="container">
            <p class="mb-0">Todo Application &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2023</span>. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
