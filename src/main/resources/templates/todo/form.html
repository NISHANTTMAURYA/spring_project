<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${todo.id != null ? 'Edit Todo' : 'Create Todo'} + ' - Todo App'">Todo Form - Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .form-header {
            background: linear-gradient(135deg, #20B2AA 0%, #009688 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        .form-card {
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .btn-primary {
            background: linear-gradient(135deg, #20B2AA 0%, #009688 100%);
            border: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
        }
        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-check2-square me-2"></i>Todo App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/todos">My Todos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/todos/extract-from-image">Add from Image</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <!-- Form Header -->
        <header class="form-header">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1 th:text="${todo.id != null ? 'Edit Todo' : 'Create New Todo'}">Todo Form</h1>
                        <p class="lead" th:text="${todo.id != null ? 'Update your existing todo' : 'Add a new task to your list'}">Manage your task</p>
                    </div>
                    <div class="col-md-4 text-end">
                        <a href="/todos" class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Back to Todos</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Form Content -->
        <div class="container mb-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="form-card card border-0">
                        <div class="card-body p-4">
                            <form th:action="${todo.id != null ? '/todos/update/' + todo.id : '/todos/create'}" 
                                method="post" th:object="${todo}">
                                
                                <!-- Title -->
                                <div class="mb-3">
                                    <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" required
                                        placeholder="Enter a clear, specific task title">
                                </div>
                                
                                <!-- Description -->
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" rows="3" th:field="*{description}"
                                            placeholder="Add any details, steps, or context for your task"></textarea>
                                </div>
                                
                                <!-- Due Date -->
                                <div class="mb-3">
                                    <label for="dueDate" class="form-label">Due Date</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                        <input type="text" class="form-control" id="dueDate" th:field="*{dueDate}" 
                                            placeholder="Select a due date">
                                    </div>
                                </div>
                                
                                <!-- Priority -->
                                <div class="mb-4">
                                    <label class="form-label">Priority</label>
                                    <div class="d-flex">
                                        <div class="form-check me-4" th:each="priority : ${priorities}">
                                            <input class="form-check-input" type="radio" 
                                                th:field="*{priority}" 
                                                th:value="${priority}" 
                                                th:id="${'priority-' + priority}">
                                            <label class="form-check-label" th:for="${'priority-' + priority}"
                                                th:text="${priority}">Priority</label>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Submit Buttons -->
                                <div class="d-flex justify-content-between">
                                    <a href="/todos" class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi" th:classappend="${todo.id != null ? 'bi-save' : 'bi-plus-circle'}"></i>
                                        <span th:text="${todo.id != null ? 'Update Todo' : 'Create Todo'}">Submit</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>Todo App with Gemini Vision</h5>
                    <p>A modern task management application with AI capabilities</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>&copy; 2023 Todo App. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        // Initialize date picker
        flatpickr("#dueDate", {
            dateFormat: "Y-m-d",
            minDate: "today",
            allowInput: true
        });
    </script>
</body>
</html>
