# Production Environment Configuration with PostgreSQL Database for Render deployment

# Database Configuration - Using Render provided PostgreSQL database
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Changed from 'public' to 'todoapp' to match our SQL schema
spring.jpa.properties.hibernate.default_schema=todoapp

# JPA/Hibernate Configuration - Create tables automatically
# Changed to create-drop to ensure tables are created on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data Initialization - Enable SQL scripts in production
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Custom database initialization flag
app.init-db=true

# Disable H2 Console in production
spring.h2.console.enabled=false

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}

# Google Gemini API Configuration
google.ai.enabled=${GEMINI_ENABLED:true}
google.ai.api-key=${GEMINI_API_KEY}
google.ai.gemini-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
