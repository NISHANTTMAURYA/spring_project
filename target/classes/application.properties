# Common Application Properties
spring.application.name=Todo App with Gemini Vision

# Default Profile Configuration
# The active profile will be overridden by command line arguments

# Server Configuration
server.port=8080

# Common JPA Properties
spring.jpa.open-in-view=false

# Debug SQL initialization
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
# Set more detailed logging for Gemini service
logging.level.com.example.demo.service.GeminiService=DEBUG
# Log HTTP client requests
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.root=INFO

# Logging Pattern Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Google Gemini API Configuration
# You need to replace these with your actual Gemini API credentials
# To get a valid API key, visit: https://makersuite.google.com/app/apikey
google.ai.api-key=AIzaSyA8DaPlDtUTyzwjo8M6aOwFcfGDLU7itJg
# Updated URL to use gemini-1.5-flash which has multimodal capabilities
google.ai.gemini-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
google.ai.project-id=your-project-id
google.ai.location=us-central1
google.ai.endpoint-id=your-endpoint-id
# Enable Gemini features
google.ai.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB