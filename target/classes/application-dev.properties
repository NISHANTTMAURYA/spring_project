# Development Environment Configuration with PostgreSQL Database

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
# Update with your actual PostgreSQL username - change from postgres to your system username
spring.datasource.username=nishantmaurya
# Your PostgreSQL password
spring.datasource.password=Tan@2024
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=todoapp

# JPA/Hibernate Configuration - Create tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development-specific settings
spring.thymeleaf.cache=false
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# H2 Console (disabled for PostgreSQL)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Data Initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.sql.init.data-locations=classpath:data-postgresql.sql

# Custom database initialization flag
app.init-db=false